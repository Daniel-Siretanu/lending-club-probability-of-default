[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probdefaultmodel"
version = "0.1.0"
description = "Probability of Default model on Lending Club data"
authors = [{ name = "Daniel Siretanu" }]
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]